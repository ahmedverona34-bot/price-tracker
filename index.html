<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متتبع الأسعار</title>
<style>
  body{background:#0c0e12;color:#e2e2e8;font-family:system-ui,"Segoe UI",sans-serif;
       margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .c{max-width:34rem;padding:2.5rem;text-align:center}
  h1{font-size:1.6rem;margin:0 0 .5rem}
  p{color:#c3c6d7;line-height:1.7}
  a{display:inline-block;margin-top:1rem;padding:.8rem 1.6rem;border-radius:8px;
    background:#2563eb;color:#fff;text-decoration:none;font-weight:600}
  a:hover{background:#0053db}
  .v{color:#4edea3;font-weight:600}
  footer{margin-top:2rem;font-size:.85rem;color:#8d90a0}
</style>
</head>
<body>
  <div class="c">
    <h1>متتبع الأسعار</h1>
    <p>تطبيق سطح مكتب يتابع أسعار الهواتف في المتاجر المصرية.</p>
    <p>الإصدار الحالي: <span class="v" id="v">…</span></p>
    <a href="https://github.com/ahmedverona34-bot/price-tracker/releases/latest"
       id="dl">تحميل النسخة الأخيرة</a>
    <footer><a href="https://github.com/ahmedverona34-bot/price-tracker"
             style="background:none;color:#8d90a0;font-weight:400">المصدر على GitHub</a></footer>
  </div>
<script>
  // latest.txt is the same manifest the app reads on launch.
  fetch("latest.txt")
    .then(function (r) { return r.ok ? r.text() : ""; })
    .then(function (t) {
      var ver = (t.split("\n")[0] || "").trim();
      if (!ver) return;
      document.getElementById("v").textContent = ver;
      var url = (t.split("\n")[1] || "").trim();
      if (url) document.getElementById("dl").href = url;
    })
    .catch(function () { /* page stays useful without the manifest */ });
</script>
</body>
</html>
